<!DOCTYPE html>
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link rel="stylesheet" href="static/css/fonts.css">
  <link rel="stylesheet" href="static/css/styles.css">
</head>
<body>
  <div id="widget-wrapper" class="container border my-5">
    <div id="suggestion-dialog-modal">
      <div id="suggestion-dialog-container">
        <div id="suggestion-dialog-top" class="row">
          <div id="suggestion-dialog-handle" class="col">
            <i class="fa-solid fa-grip-vertical align-middle" aria-hidden="true"></i>
          </div>
          <div id="suggestion-dialog-close" class="col text-end">
            <i class="fa-solid fa-xmark align-middle" aria-label="Close" role="button"></i>
          </div>
        </div>
        <div id="suggestion-content" class="p-3">
          <div id="suggestion-form" role="form">
            <div id="suggestion-form-inputs">
              <div id="suggestion-header">
                <h2 id="suggestion-title">
                  Ehdota muutosta käsitteeseen kissa
                </h2>
                <p id="suggestion-subtitle">
                  Kuka tahansa sanaston käyttäjä saa ehdottaa muutoksia sanastoon
                </p>
              </div>

              <div class="suggestion-input-container">
                <label class="suggestion-input-label" for="suggestion-change">Ehdotettu muutos:</label>
                <div class="suggestion-clear-input suggestion-clear-textarea">
                  <i class="fa-solid fa-xmark" aria-label="Clear" role="button"></i>
                </div>
                <textarea id="suggestion-change" class="suggestion-input" rows="3"></textarea>
              </div>

              <div class="suggestion-input-container">
                <label class="suggestion-input-label" for="suggestion-change-info">Perustelut ehdotukselle:</label>
                <div class="suggestion-clear-input suggestion-clear-textarea">
                  <i class="fa-solid fa-xmark" aria-label="Clear" role="button"></i>
                </div>
                <textarea id="suggestion-change-info" class="suggestion-input" rows="3"></textarea>
              </div>

              <div class="suggestion-input-container">
                <label class="suggestion-input-label" for="suggestion-organization">Ehdottajan organisaatio:</label>
                <input id="suggestion-organization" class="suggestion-input" type="text" />
                <div class="suggestion-clear-input">
                  <i class="fa-solid fa-xmark" aria-label="Clear" role="button"></i>
                </div>
              </div>

              <div id="suggestion-handling">
                <p>x.x.2025 mennessä tehdyt ehdotukset otetaan asialistalle x.x.2025 sanastokokouksessa.</p>
              </div>
            </div>
            <div id="suggestion-form-submit" class="d-flex justify-content-end">
              <button id="suggestion-form-submit-button" role="button">
                Lähetä käsite-ehdotus
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
</body>
