name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  cypress-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install Node
        uses: actions/setup-node@v3
        with:
          node-version: 20.x

      - name: Install JavaScript dependencies
        run: npm install

      - name: Run Docker container
        run: ./tests/start_container.sh

      - name: Run Cypress tests
        run: npx cypress run

      - name: Upload Cypress screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: /home/runner/work/Skosmos-widget-suggestions/Skosmos-widget-suggestions/tests/cypress/screenshots/**
